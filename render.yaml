services:
  - type: web
    name: accessable-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt && (python -m playwright install chromium || true)"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
